name: Déploiement

# La production ne part qu'après une CI verte sur main — ou à la main depuis
# l'onglet Actions. Tant que les trois secrets VERCEL_* ne sont pas posés, la
# tâche se contente de le dire et reste verte : rien n'est publié, rien
# n'échoue.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploiement-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    name: Vercel (production)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      URL_PRODUCTION: https://gereotimes.vercel.app
    steps:
      - name: Constater la configuration
        id: config
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "pret=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Déploiement ignoré::Secrets VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID absents — voir DEPLOIEMENT.md."
          else
            echo "pret=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Récupérer le dépôt
        if: steps.config.outputs.pret == 'true'
        uses: actions/checkout@v7
        with:
          # Après une CI, on publie exactement le commit contrôlé.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Installer Node 22
        if: steps.config.outputs.pret == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer la CLI Vercel
        if: steps.config.outputs.pret == 'true'
        run: npm install --global vercel@latest

      - name: Publier en production
        if: steps.config.outputs.pret == 'true'
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel deploy --prod --yes --token="$VERCEL_TOKEN" | tee /tmp/url-deploiement.txt

      - name: Contrôler la mise en ligne
        if: steps.config.outputs.pret == 'true'
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL_PRODUCTION")
          echo "Production : HTTP $code"
          test "$code" = "200"
